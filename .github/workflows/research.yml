name: Validate research and build community database
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_cua_batch_helpers.js
      - run: python demo.py
      - run: python collector_demo.py
      - run: python build_community.py
      - run: python scripts/build_revision_report.py --input aggregates/topic-balanced-20261015-v1.json --output exports/tag-aggregates.html
      - uses: actions/upload-artifact@v4
        with:
          name: community-database-and-report
          path: |
            exports/community.sqlite
            exports/community.html
            exports/tag-aggregates.html
          if-no-files-found: error
